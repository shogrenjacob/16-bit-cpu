site_name: Guin-16 Docs
repo_url: https://github.com/shogrenjacob/16-bit-cpu

theme:
  name: material
  logo: imgs/guin.png
  favicon: imgs/guin.png
  palette: 

    # Palette toggle for light mode
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
extra:
  generator: false

extra_css:
  - stylesheets/extra.css